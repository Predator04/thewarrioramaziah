<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Purple and black fighter poster artwork</title>
  <desc id="desc">A stylized boxing poster placeholder for a warrior fighter brand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
